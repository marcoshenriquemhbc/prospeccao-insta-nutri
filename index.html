<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Prospecção</title>
<meta name="theme-color" content="#0b0d10">
<style>
:root{--bg:#0b0d10;--panel:#14171b;--panel2:#1b1f24;--border:#232830;--text:#e8eaed;--muted:#9aa0a6;--accent:#8b5cf6;--ok:#22c55e;--no:#ef4444;--ig:linear-gradient(135deg,#f9ce34,#ee2a7b 45%,#6228d7);}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Inter",system-ui,sans-serif;padding:env(safe-area-inset-top,0px) 12px env(safe-area-inset-bottom,0px)}
.wrap{max-width:720px;margin:0 auto;padding:12px 0 60px}
h1{font-size:13px;letter-spacing:.16em;text-transform:uppercase;margin:0 0 10px;font-weight:600}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tab{flex:1;background:var(--panel2);border:1px solid var(--border);color:var(--muted);padding:10px;border-radius:10px;font-weight:600;font-size:13px;cursor:pointer}
.tab.on{color:#fff;border-color:var(--accent)}
.status{font-size:12px;color:var(--muted);margin:6px 0 12px;min-height:16px}
select,input{width:100%;background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:12px;border-radius:10px;font-size:14px;font-family:inherit}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
button{border:none;border-radius:10px;font-weight:700;cursor:pointer;font-size:14px;color:#fff;padding:12px 14px}
button:disabled{opacity:.35;cursor:not-allowed}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-ok{background:var(--ok);color:#04241a}
.btn-no{background:var(--no)}
.btn-ig{background:var(--ig)}
.btn-link{display:block;text-decoration:none;text-align:center;padding:12px 14px;color:#fff;border-radius:10px;font-weight:700;font-size:14px}
.bar{height:8px;background:var(--panel2);border-radius:8px;overflow:hidden;margin:8px 0 14px}
.bar>div{height:100%;background:var(--ok);width:0;transition:width .2s}
.count{font-size:13px;color:var(--muted);text-align:center;margin-bottom:10px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:22px 18px;text-align:center}
.card-user{font-size:22px;font-weight:800;word-break:break-all}
.card-nome{font-size:14px;color:var(--muted);margin-top:6px;min-height:18px}
.card-meta{font-size:12px;color:var(--muted);margin-top:4px}
.card .btn-link{margin-top:14px}
.decide{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.decide button{padding:18px 10px;font-size:16px}
.undo{margin-top:12px;width:100%}
.done-box{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:22px;text-align:center;margin-top:12px}
.done-box h2{font-size:16px;margin:0 0 6px}
.done-box p{color:var(--muted);font-size:13px;margin:0 0 14px}
.kbd{font-size:11px;color:var(--muted);margin-top:10px}
.list{margin-top:12px}
.item{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:8px}
.item-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.item-user{font-weight:700;word-break:break-all}
.item-meta{font-size:12px;color:var(--muted);margin-top:3px}
.pill{font-size:11px;border-radius:20px;padding:4px 10px;background:var(--panel2);color:var(--muted);white-space:nowrap}
.pill.fila{color:#c4b5fd}.pill.contatado{color:#7dd3fc}.pill.respondeu{color:#4ade80}.pill.recusou{color:var(--no)}
.item-btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.item-btns button,.item-btns a.btn-link{flex:1;min-width:100px;padding:9px 10px;font-size:12px}
.empty{color:var(--muted);text-align:center;padding:30px 10px;font-size:14px}
.sel{font-size:11px;border-radius:6px;padding:2px 7px;margin-left:4px;display:inline-block}
.sel.ok{background:#14532d;color:#86efac;font-weight:700}
.sel.pend{border:1px dashed #6b7280;color:#9ca3af}
.sel.none{color:#9ca3af}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.summary div{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:10px;text-align:center}
.summary b{display:block;font-size:20px}
.summary span{font-size:11px;color:var(--muted)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal-bg.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px;max-width:380px;width:100%}
.modal h2{font-size:16px;margin:0 0 8px}
.modal p{font-size:13px;color:var(--muted);line-height:1.5;margin:0 0 14px}
.modal .row button{flex:1}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <h1>Prospecção</h1>
  <div class="tabs">
    <button class="tab on" id="tabTriagem">Triagem</button>
    <button class="tab" id="tabFila">Abordagem</button>
  </div>
  <div class="status" id="status">Carregando…</div>

  <!-- ===== TRIAGEM (por dia) ===== -->
  <section id="viewTriagem">
    <div class="row">
      <select id="diaSel" class="grow"></select>
      <button class="btn-ghost" id="btnSync">🔄</button>
      <button class="btn-no" id="btnApagar">🗑</button>
    </div>
    <div class="bar"><div id="barra"></div></div>
    <div class="count" id="contagem"></div>
    <div id="cardArea"></div>
    <div id="finalArea" hidden>
      <div class="done-box">
        <h2 id="finalTitulo"></h2>
        <p id="finalTexto"></p>
        <button class="btn-ok" id="btnFinalizar" style="width:100%">Confirmar o dia e enviar os aprovados para a fila</button>
      </div>
    </div>
    <div class="kbd">Atalhos: P ou → prospectar · D ou ← descartar · Z desfazer</div>
  </section>

  <!-- ===== ABORDAGEM (fila por dia) ===== -->
  <section id="viewFila" hidden>
    <div class="summary" id="painelNovos">
      <div><b id="nInsta">0</b><span>Instagram (sem canal)</span></div>
      <div><b id="nDisp">0</b><span>WhatsApp/e-mail pendente</span></div>
      <div><b id="nTotal">0</b><span>total novos</span></div>
    </div>
    <div class="count" id="nFollow" style="margin-bottom:12px"></div>
    <div class="summary">
      <div><b id="sFila">0</b><span>na fila</span></div>
      <div><b id="sHoje">0</b><span>enviados hoje</span></div>
      <div><b id="sResp">0</b><span>responderam</span></div>
    </div>
    <input type="text" id="busca" placeholder="🔎 WhatsApp, e-mail, @ ou nome" style="margin-bottom:10px">
    <div class="row" style="margin-bottom:10px">
      <select id="filtroDia" class="grow"></select>
      <select id="filtroFila" class="grow">
        <option value="ativos">Ativos (fila e contatados)</option>
        <option value="sem_canal">Sem canal (Instagram)</option>
        <option value="fila">Na fila</option>
        <option value="contatado">Contatados</option>
        <option value="respondeu">Responderam</option>
        <option value="recusou">Recusaram</option>
      </select>
      <button class="btn-ghost" id="btnSyncFila">🔄</button>
    </div>
    <div class="list" id="listaFila"></div>
  </section>
</div>

<div class="modal-bg" id="modal"><div class="modal" id="modalBox"></div></div>

<script>
const API = 'https://n8n.iaatende.click/webhook';
const state = { extraidos: [], eventos: [], fila: [], envios: [], pilha: [] };

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function hoje(){ return new Date().toLocaleDateString('sv-SE', { timeZone: 'America/Sao_Paulo' }); }
function setStatus(t){ document.getElementById('status').textContent = t; }
function dataBr(iso){ const p = String(iso).split('-'); return p[2] + '/' + p[1] + '/' + p[0]; }

/* ---------- agrupamento por dia de extracao ---------- */
function diaDe(e){ return String(e.data_extracao || '').slice(0, 10); }
function diasLista(){ return [...new Set(state.extraidos.map(diaDe).filter(Boolean))].sort().reverse(); }
function itensDoDia(d){ return state.extraidos.filter(e => diaDe(e) === d); }
function lotesDoDia(d){ return [...new Set(itensDoDia(d).map(e => e.lote))]; }

/* ---------- eventos ---------- */
function ultimaAcao(u, l, grupo){
  const evs = state.eventos.filter(e => e.username === u && e.lote === l && grupo.includes(e.acao))
    .sort((a, b) => String(a.data_hora).localeCompare(String(b.data_hora)));
  return evs.length ? evs[evs.length - 1].acao : null;
}
function decisao(u, l){ return ultimaAcao(u, l, ['prospectar', 'descartar', 'desfeito']); }
function loteConfirmado(l){
  const evs = state.eventos.filter(e => e.username === '__lote__' && e.lote === l)
    .sort((a, b) => String(a.data_hora).localeCompare(String(b.data_hora)));
  return evs.length > 0 && evs[evs.length - 1].acao === 'lote_confirmado';
}
function diaConfirmado(d){ const ls = lotesDoDia(d); return ls.length > 0 && ls.every(loteConfirmado); }
function pendentes(d){ return itensDoDia(d).filter(e => { const x = decisao(e.username, e.lote); return !x || x === 'desfeito'; }); }
function aprovados(d){ return itensDoDia(d).filter(e => decisao(e.username, e.lote) === 'prospectar'); }

function loteDoLead(u){
  const ev = state.eventos.filter(e => e.username === u && e.acao === 'confirmado_fila')
    .sort((a, b) => String(a.data_hora).localeCompare(String(b.data_hora)));
  return ev.length ? ev[ev.length - 1].lote : '';
}
function diaDoLead(u){
  const l = loteDoLead(u);
  if(!l) return '';
  const reg = state.extraidos.find(x => x.username === u && x.lote === l);
  return reg ? diaDe(reg) : '';
}

async function gravarAcao(u, l, acao){
  const r = await fetch(API + '/prospeccao-triagem-acao', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ username: u, lote: l, acao: acao })
  });
  if(!r.ok) throw new Error('HTTP ' + r.status);
  state.eventos.push({ username: u, lote: l, acao: acao, data_hora: new Date().toISOString() });
}

/* ---------- sincronizacao ---------- */
async function sincronizar(){
  setStatus('Carregando…');
  try{
    const r = await fetch(API + '/prospeccao-triagem-lotes');
    if(!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    state.extraidos = d.extraidos || [];
    state.eventos = d.eventos || [];
    atualizarDiaSel();
    renderTriagem();
    setStatus('Atualizado às ' + new Date().toLocaleTimeString('pt-BR'));
  }catch(err){ setStatus('Erro ao carregar: ' + err.message); }
}

async function sincronizarFila(){
  try{
    const r = await fetch(API + '/prospeccao-fila');
    if(!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    state.fila = d.leads || [];
    state.envios = d.envios || [];
    const rl = await fetch(API + '/prospeccao-triagem-lotes');
    if(rl.ok){ const dl = await rl.json(); state.extraidos = dl.extraidos || []; state.eventos = dl.eventos || []; }
    atualizarFiltroDia();
    renderFila();
  }catch(err){ setStatus('Erro na abordagem: ' + err.message); }
}

/* ---------- triagem por dia ---------- */
function rotuloDia(d){
  const n = lotesDoDia(d).length;
  const p = itensDoDia(d).length;
  return dataBr(d) + ' · ' + n + ' extração(ões) · ' + p + ' perfis' + (diaConfirmado(d) ? ' ✅' : '');
}

function atualizarDiaSel(){
  const sel = document.getElementById('diaSel');
  const atual = sel.value;
  const dias = diasLista();
  sel.innerHTML = dias.map(d => '<option value="' + d + '">' + esc(rotuloDia(d)) + '</option>').join('');
  if(atual && dias.includes(atual)) sel.value = atual;
  else {
    const abertos = dias.find(d => !diaConfirmado(d));
    if(abertos) sel.value = abertos;
  }
}

function renderTriagem(){
  const d = document.getElementById('diaSel').value;
  const area = document.getElementById('cardArea');
  const fin = document.getElementById('finalArea');
  if(!d){ area.innerHTML = '<div class="empty">Sem extrações.</div>'; fin.hidden = true; return; }

  const tudo = itensDoDia(d);
  const pend = pendentes(d);
  const ok = aprovados(d).length;
  const conf = diaConfirmado(d);
  document.getElementById('barra').style.width = tudo.length ? ((tudo.length - pend.length) / tudo.length * 100) + '%' : '0';
  document.getElementById('contagem').textContent = tudo.length
    ? (tudo.length - pend.length) + ' de ' + tudo.length + ' decididos · ' + ok + ' para prospectar'
    : 'Nenhum perfil neste dia';
  const apagar = document.getElementById('btnApagar');
  apagar.disabled = !tudo.length || lotesDoDia(d).some(loteConfirmado);
  apagar.title = apagar.disabled ? 'Há extrações já confirmadas' : 'Apagar as extrações deste dia';

  if(!tudo.length){ area.innerHTML = '<div class="empty">Sem perfis neste dia.</div>'; fin.hidden = true; return; }

  if(conf){
    area.innerHTML = '<div class="done-box"><h2>Dia já enviado para a fila</h2><p>' + ok + ' perfil(s) aprovado(s) entraram na base de disparo.</p></div>';
    fin.hidden = true;
    return;
  }

  if(pend.length){
    const p = pend[0];
    area.innerHTML =
      '<div class="card">' +
        '<div class="card-user">@' + esc(p.username) + '</div>' +
        '<div class="card-nome">' + esc(p.nome) + '</div>' +
        '<div class="card-meta">Extração ' + esc(p.lote) + ' · ' + pend.length + ' pendente(s)</div>' +
        '<a class="btn-ig btn-link" href="https://www.instagram.com/' + encodeURIComponent(p.username) + '/" target="_blank" rel="noopener">Abrir no Instagram</a>' +
        '<div class="decide">' +
          '<button class="btn-no" id="btnNao">✕ Descartar</button>' +
          '<button class="btn-ok" id="btnSim">✓ Prospectar</button>' +
        '</div>' +
        '<button class="btn-ghost undo" id="btnDesfazer"' + (state.pilha.length ? '' : ' disabled') + '>↶ Desfazer última</button>' +
      '</div>';
    document.getElementById('btnSim').onclick = () => decidir(p, 'prospectar');
    document.getElementById('btnNao').onclick = () => decidir(p, 'descartar');
    document.getElementById('btnDesfazer').onclick = desfazer;
    fin.hidden = true;
    return;
  }

  area.innerHTML = '';
  document.getElementById('finalTitulo').textContent = 'Triagem do dia concluída';
  document.getElementById('finalTexto').textContent = ok + ' aprovado(s) e ' + (tudo.length - ok) + ' descartado(s) em ' + lotesDoDia(d).length + ' extração(ões). Confirmar o envio dos aprovados para a fila?';
  fin.hidden = false;
}

async function decidir(p, acao){
  const anterior = decisao(p.username, p.lote) || 'desfeito';
  state.pilha.push({ u: p.username, l: p.lote, anterior: anterior });
  renderTriagem();
  try{ await gravarAcao(p.username, p.lote, acao); }
  catch(err){ state.pilha.pop(); alert('Não consegui salvar: ' + err.message); }
  renderTriagem();
}

async function desfazer(){
  const it = state.pilha.pop();
  if(!it) return;
  try{ await gravarAcao(it.u, it.l, it.anterior); }
  catch(err){ state.pilha.push(it); alert('Não consegui desfazer: ' + err.message); }
  renderTriagem();
}

function abrirModal(corpo, botoes, acoes){
  document.getElementById('modalBox').innerHTML = corpo + '<div class="row">' + botoes + '</div>';
  Object.keys(acoes).forEach(sel => { document.querySelector(sel).onclick = acoes[sel]; });
  document.getElementById('mNao').onclick = fecharModal;
  document.getElementById('modal').classList.add('show');
}
function fecharModal(){ document.getElementById('modal').classList.remove('show'); }

function abrirModalApagar(){
  const d = document.getElementById('diaSel').value;
  const n = itensDoDia(d).length;
  abrirModal('<h2>Apagar as extrações de ' + dataBr(d) + '?</h2><p>Saem ' + n + ' perfil(s) deste dia. Os perfis continuam na base de dedupe e não voltam a ser extraídos.</p>',
    '<button class="btn-ghost" id="mNao">Cancelar</button><button class="btn-no" id="mSim">Apagar</button>',
    { '#mSim': apagarDia });
}

async function apagarDia(){
  fecharModal();
  const d = document.getElementById('diaSel').value;
  try{
    for(const lote of lotesDoDia(d)){
      const r = await fetch(API + '/prospeccao-triagem-apagar-lote', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ lote: lote })
      });
      if(!r.ok) throw new Error('HTTP ' + r.status);
    }
    state.extraidos = state.extraidos.filter(e => diaDe(e) !== d);
    state.pilha = [];
    atualizarDiaSel();
    renderTriagem();
  }catch(err){ alert('Não consegui apagar: ' + err.message); }
}

function abrirModalFinalizar(){
  const d = document.getElementById('diaSel').value;
  const ok = aprovados(d).length;
  if(!ok){ alert('Nenhum perfil aprovado neste dia.'); return; }
  abrirModal('<h2>Confirmar o envio?</h2><p>' + ok + ' perfil(s) aprovado(s) vão para a base, de ' + lotesDoDia(d).length + ' extração(ões). O sorteio das 08h monta os disparos (WhatsApp e e-mail) por ordem de confirmação.</p>',
    '<button class="btn-ghost" id="mNao">Cancelar</button><button class="btn-ok" id="mSim">Confirmar</button>',
    { '#mSim': confirmarDia });
}

async function confirmarDia(){
  fecharModal();
  const d = document.getElementById('diaSel').value;
  const btn = document.getElementById('btnFinalizar');
  btn.disabled = true;
  try{
    const lotes = [...new Set(aprovados(d).map(e => e.lote))];
    for(const lote of lotes){
      const r = await fetch(API + '/prospeccao-triagem-confirmar', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ lote: lote })
      });
      if(!r.ok) throw new Error('HTTP ' + r.status);
      state.eventos.push({ username: '__lote__', lote: lote, acao: 'lote_confirmado', data_hora: new Date().toISOString() });
    }
    atualizarDiaSel();
    renderTriagem();
    setStatus('Dia enviado para a fila. A base atualiza em alguns segundos.');
    setTimeout(sincronizar, 5000);
  }catch(err){ alert('Não consegui confirmar: ' + err.message); }
  finally{ btn.disabled = false; }
}

/* ---------- abordagem (fila por dia) ---------- */
function atualizarFiltroDia(){
  const sel = document.getElementById('filtroDia');
  const atual = sel.value;
  const dias = [...new Set(state.fila.map(l => diaDoLead(l.username)).filter(Boolean))].sort().reverse();
  sel.innerHTML = '<option value="todos">Todos os dias</option>' +
    dias.map(d => '<option value="' + d + '">' + dataBr(d) + '</option>').join('');
  if(atual && (atual === 'todos' || dias.includes(atual))) sel.value = atual;
  else if(dias.length) sel.value = dias[0];
}

function digitos(s){ return String(s || '').replace(/\D/g, ''); }
function matchStatus(l, s){
  if(s === 'ativos') return l.status === 'fila' || l.status === 'contatado';
  if(s === 'sem_canal') return l.status === 'fila' && !l.whatsapp && !l.email;
  return l.status === s;
}
function matchBusca(l, q){
  const t = q.trim().toLowerCase();
  if(!t) return true;
  const dq = digitos(t);
  if(dq.length >= 6 && digitos(l.whatsapp).endsWith(dq.slice(-8))) return true;
  if(String(l.email || '').toLowerCase().includes(t)) return true;
  if(String(l.username || '').toLowerCase().includes(t.replace(/^@/, ''))) return true;
  if(String(l.nome || '').toLowerCase().includes(t)) return true;
  return false;
}

function renderFila(){
  const hj = hoje();
  const enviadosHoje = new Set(state.envios.filter(e => String(e.data_envio || '').slice(0, 10) === hj).map(e => e.username));
  document.getElementById('sFila').textContent = state.fila.filter(l => l.status === 'fila').length;
  document.getElementById('sHoje').textContent = enviadosHoje.size;
  document.getElementById('sResp').textContent = state.fila.filter(l => l.status === 'respondeu').length;

  const dia = document.getElementById('filtroDia').value;
  const status = document.getElementById('filtroFila').value;
  const busca = document.getElementById('busca').value;
  const baseDia = state.fila.filter(l => dia === 'todos' || diaDoLead(l.username) === dia);
  const semCanal = baseDia.filter(l => l.status === 'fila' && !l.whatsapp && !l.email).length;
  const comCanal = baseDia.filter(l => l.status === 'fila' && (l.whatsapp || l.email)).length;
  const followUp = baseDia.filter(l => l.status === 'contatado').length;
  document.getElementById('nInsta').textContent = semCanal;
  document.getElementById('nDisp').textContent = comCanal;
  document.getElementById('nTotal').textContent = semCanal + comCanal;
  document.getElementById('nFollow').textContent = followUp + ' contatado(s) sem resposta, também liberados para o Instagram';
  const lista = state.fila
    .filter(l => busca.trim() ? matchBusca(l, busca) : (matchStatus(l, status) && (dia === 'todos' || diaDoLead(l.username) === dia)))
    .sort((a, b) => String(a.username).localeCompare(String(b.username)));
  const el = document.getElementById('listaFila');
  if(!lista.length){ el.innerHTML = '<div class="empty">Nada aqui.</div>'; return; }
  el.innerHTML = lista.map(l => {
    const enviadoPor = canal => state.envios.some(e => e.username === l.username && e.canal === canal);
    const selo = (rot, canal, tem) => tem ? '<span class="sel ' + (enviadoPor(canal) ? 'ok' : 'pend') + '">' + rot + '</span>' : '';
    const canais = (selo('WhatsApp', 'whatsapp', !!l.whatsapp) + selo('E-mail', 'email', !!l.email)) || '<span class="sel none">sem contato</span>';
    const u = esc(l.username);
    const lote = loteDoLead(l.username);
    let btns = '<a class="btn-ig btn-link" href="https://www.instagram.com/' + encodeURIComponent(l.username) + '/" target="_blank" rel="noopener">Instagram</a>';
    if(l.status === 'respondeu' || l.status === 'recusou'){
      btns += '<button class="btn-ghost" data-acao="reabrir" data-u="' + u + '">↶ Reabrir</button>';
    } else {
      btns += '<button class="btn-ok" data-acao="respondeu" data-u="' + u + '">💬 Respondeu</button>' +
              '<button class="btn-no" data-acao="recusou" data-u="' + u + '">🚫 Recusou</button>';
    }
    return '<div class="item"><div class="item-top"><div>' +
      '<div class="item-user">@' + u + '</div>' +
      '<div class="item-meta">' + esc(l.nome) + ' · ' + canais + (lote ? ' · extração ' + esc(lote) : '') + '</div></div>' +
      '<span class="pill ' + esc(l.status) + '">' + esc(l.status) + '</span></div>' +
      '<div class="item-btns">' + btns + '</div></div>';
  }).join('');
}

async function acaoFila(u, acao){
  const lead = state.fila.find(l => l.username === u);
  const lote = loteDoLead(u);
  try{
    await gravarAcao(u, lote || '__fila__', acao);
    if(lead) lead.status = acao === 'respondeu' ? 'respondeu' : acao === 'recusou' ? 'recusou' : 'contatado';
    renderFila();
  }catch(err){ alert('Não consegui salvar: ' + err.message); }
}

/* ---------- abas ---------- */
function mostrar(aba){
  const t = aba === 'triagem';
  document.getElementById('viewTriagem').hidden = !t;
  document.getElementById('viewFila').hidden = t;
  document.getElementById('tabTriagem').classList.toggle('on', t);
  document.getElementById('tabFila').classList.toggle('on', !t);
  if(!t) sincronizarFila();
}

/* ---------- eventos ---------- */
document.getElementById('tabTriagem').onclick = () => mostrar('triagem');
document.getElementById('tabFila').onclick = () => mostrar('fila');
document.getElementById('diaSel').onchange = () => { state.pilha = []; renderTriagem(); };
document.getElementById('btnSync').onclick = sincronizar;
document.getElementById('btnApagar').onclick = abrirModalApagar;
document.getElementById('btnFinalizar').onclick = abrirModalFinalizar;
document.getElementById('btnSyncFila').onclick = sincronizarFila;
document.getElementById('filtroDia').onchange = renderFila;
document.getElementById('filtroFila').onchange = renderFila;
document.getElementById('busca').oninput = renderFila;
document.getElementById('modal').addEventListener('click', e => { if(e.target.id === 'modal') fecharModal(); });

document.getElementById('listaFila').addEventListener('click', e => {
  const b = e.target.closest('button');
  if(!b || !b.dataset.acao) return;
  acaoFila(b.dataset.u, b.dataset.acao);
});

document.addEventListener('keydown', e => {
  if(document.getElementById('viewTriagem').hidden) return;
  if(document.getElementById('modal').classList.contains('show')) return;
  const tag = (e.target.tagName || '').toLowerCase();
  if(tag === 'input' || tag === 'select' || tag === 'textarea') return;
  const d = document.getElementById('diaSel').value;
  const pend = pendentes(d);
  if(!pend.length) return;
  const k = e.key.toLowerCase();
  if(k === 'p' || e.key === 'ArrowRight') decidir(pend[0], 'prospectar');
  else if(k === 'd' || e.key === 'ArrowLeft') decidir(pend[0], 'descartar');
  else if(k === 'z') desfazer();
});

sincronizar();
</script>
