<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prospecção</title>
<meta name="theme-color" content="#0b0d10">
<style>
:root{--bg:#0b0d10;--panel:#14171b;--panel2:#1b1f24;--border:#232830;--text:#e8eaed;--muted:#9aa0a6;--accent:#8b5cf6;--ig:linear-gradient(135deg,#f9ce34,#ee2a7b 45%,#6228d7);--wa:#22c55e;--done:#2dd4a7;--danger:#ef4444;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Inter",system-ui,sans-serif;padding:16px 12px 60px}
.wrap{max-width:1200px;margin:0 auto}
h1{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:#fff;margin:0 0 4px;font-weight:600}
.status{font-size:12px;color:#fff;margin-bottom:14px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
select,input[type=text]{background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:8px;font-size:13px;font-family:inherit}
.grow{flex:1;min-width:160px}
.lote-done{display:flex;align-items:center;gap:6px;font-size:12px;color:#fff;background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:9px 10px;cursor:pointer;white-space:nowrap}
.lote-done input{width:18px;height:18px;accent-color:var(--wa);cursor:pointer}
.lote-done input:disabled{cursor:not-allowed}
button{border:none;border-radius:8px;font-weight:600;cursor:pointer;font-size:13px;color:#fff;padding:10px 14px}
button:disabled{opacity:.35;cursor:not-allowed}
button:active{transform:scale(.97)}
.btn-primary{background:var(--accent)}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-ig{background:var(--ig)}
.btn-ok{background:var(--done);color:#04241a}
.btn-danger{background:transparent;border:1px solid var(--danger);color:var(--danger)}
.actionbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-items:start}
@media(max-width:900px){.board{grid-template-columns:1fr}}
.col{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:10px;min-height:120px;transition:background .15s,border-color .15s}
.col.over{border-color:var(--accent);background:#1d1830}
.col-head{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700;color:#fff;padding:4px 4px 10px}
.count{background:var(--panel2);border-radius:20px;padding:2px 9px;font-size:12px}
.card{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:8px;cursor:grab}
.card.dragging{opacity:.4}
.card-user{font-weight:700;font-size:14px;word-break:break-all}
.card-meta{font-size:11px;color:var(--muted);margin-top:4px}
.card-btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.card-btns button{padding:7px 9px;font-size:12px;flex:1;min-width:110px}
.sel-label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);padding:6px 8px;background:var(--panel);border:1px solid var(--border);border-radius:8px;flex:1;min-width:110px}
.check{width:18px;height:18px;accent-color:var(--accent);flex-shrink:0}
.tag{font-size:11px;border-radius:20px;padding:4px 10px;background:var(--panel);color:var(--muted);white-space:nowrap}
.empty{font-size:12px;color:var(--muted);text-align:center;padding:20px 6px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal-bg.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px;max-width:380px;width:100%}
.modal h2{font-size:15px;margin:0 0 8px}
.modal p{font-size:13px;color:var(--muted);line-height:1.5;margin:0 0 14px}
.modal .row{display:flex;gap:8px}
.modal .row button{flex:1}
</style>
</head>
<body>
<div class="wrap">
  <h1>Prospecção</h1>
  <div class="status" id="status">Carregando…</div>

  <div class="toolbar">
    <select id="loteSel" class="grow"></select>
    <label class="lote-done" title="Marcar este lote como concluído"><input type="checkbox" id="chkLoteOk" disabled> Concluído</label>
    <input type="text" id="busca" class="grow" placeholder="🔎 Buscar @">
    <button class="btn-ghost" id="btnSync">🔄 Sincronizar</button>
    <button class="btn-danger" id="btnApagarLote" disabled>🗑 Apagar lote</button>
  </div>

  <div class="actionbar">
    <button class="btn-ghost" id="btnSelTodos">☑️ Selecionar todos (coluna 2)</button>
    <button class="btn-ghost" id="btnLimpar">Limpar seleção</button>
    <button class="btn-ghost" id="btnDesfazer" disabled>↶ Desfazer</button>
    <span id="selInfo" style="font-size:12px;color:#fff"></span>
    <button class="btn-primary" id="btnFluxo" disabled style="margin-left:auto">📤 Enviar selecionados para o fluxo</button>
  </div>

  <div class="board">
    <div class="col" data-col="1">
      <div class="col-head">Enviar no Insta <span class="count" id="c1">0</span></div>
      <div id="l1"></div>
    </div>
    <div class="col" data-col="2">
      <div class="col-head">Enviar no WhatsApp / n8n / e-mail <span class="count" id="c2">0</span></div>
      <div id="l2"></div>
    </div>
    <div class="col" data-col="3">
      <div class="col-head">Concluídos <span class="count" id="c3">0</span></div>
      <div id="l3"></div>
    </div>
  </div>
</div>

<div class="modal-bg" id="modal"><div class="modal" id="modalBox"></div></div>

<script>
const API = 'https://n8n.iaatende.click/webhook';
const FLUXO = API + '/prospeccao-novos';
const state = { extraidos: [], eventos: [], selecionados: new Set(), historico: [] };

/* ---------- utilitários ---------- */
function chave(u, l){ return u + '|' + l; }
function escapeHtml(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function numLote(l){ const m = /-\s*(\d+)$/.exec(l || ''); return m ? parseInt(m[1], 10) : 0; }
function dataBr(iso){ const p = String(iso || '').slice(0,10).split('-'); return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : ''; }

/* ---------- regras de status ---------- */
// Sem evento, ou ultimo evento "desfeito" = coluna 1.
// Ultimo evento "insta_enviado" = coluna 2.
// Qualquer outro ("respondeu", "enviado_fluxo", "descartado") = coluna 3.
function statusDe(u, l){
  const evs = state.eventos.filter(e => e.username === u && e.lote === l)
    .sort((a, b) => String(a.data_hora).localeCompare(String(b.data_hora)));
  return evs.length ? evs[evs.length - 1].acao : null;
}
function colunaDe(acao){
  if(!acao || acao === 'desfeito') return 1;
  if(acao === 'insta_enviado') return 2;
  return 3;
}

function lotesOrdenados(){
  const mapa = {};
  state.extraidos.forEach(e => {
    if(!e.lote) return;
    if(!mapa[e.lote]) mapa[e.lote] = { lote: e.lote, data: '', count: 0 };
    const d = String(e.data_extracao || '').slice(0,10);
    if(d > mapa[e.lote].data) mapa[e.lote].data = d;
    mapa[e.lote].count++;
  });
  return Object.values(mapa).sort((a, b) => b.data.localeCompare(a.data) || numLote(b.lote) - numLote(a.lote));
}

function itensFiltrados(){
  const lote = document.getElementById('loteSel').value;
  const termo = document.getElementById('busca').value.trim().replace(/^@/, '').toLowerCase();
  return state.extraidos.filter(e =>
    (lote === 'todos' || e.lote === lote) &&
    (!termo || String(e.username).toLowerCase().includes(termo))
  );
}

/* ---------- renderização ---------- */
function render(){
  const cols = {1:[], 2:[], 3:[]};
  itensFiltrados().forEach(e => {
    const acao = statusDe(e.username, e.lote);
    cols[colunaDe(acao)].push({ e, acao });
  });
  document.getElementById('c1').textContent = cols[1].length;
  document.getElementById('c2').textContent = cols[2].length;
  document.getElementById('c3').textContent = cols[3].length;
  renderColuna('l1', cols[1], 1);
  renderColuna('l2', cols[2], 2);
  renderColuna('l3', cols[3], 3);
  atualizarSelecao();
  atualizarBotaoLote();
  document.getElementById('btnDesfazer').disabled = state.historico.length === 0;
}

function renderColuna(id, lista, n){
  const el = document.getElementById(id);
  if(!lista.length){ el.innerHTML = '<div class="empty">Nada aqui</div>'; return; }
  el.innerHTML = lista.map(({e, acao}) => {
    const k = chave(e.username, e.lote);
    const u = escapeHtml(e.username);
    const lt = escapeHtml(e.lote);
    const nome = e.nome ? '<div class="card-meta">' + escapeHtml(e.nome) + '</div>' : '';
    const ig = '<button class="btn-ig" data-abrir="' + u + '">Abrir Insta</button>';
    let acoes = '';
    if(n === 1){
      acoes = ig + '<button class="btn-ok" data-insta="' + u + '" data-lote="' + lt + '">✅ Enviei no Insta</button>';
    } else if(n === 2){
      acoes = '<label class="sel-label"><input type="checkbox" class="check" data-sel="' + escapeHtml(k) + '"' +
        (state.selecionados.has(k) ? ' checked' : '') + '> Enviar</label>' +
        ig + '<button class="btn-danger" data-resp="' + u + '" data-lote="' + lt + '">💬 Respondeu</button>';
    } else {
      const rotulos = {respondeu:'💬 Respondeu', enviado_fluxo:'📤 Enviado ao fluxo', descartado:'🚫 Descartado'};
      acoes = '<span class="tag">' + (rotulos[acao] || escapeHtml(acao)) + '</span>' + ig;
    }
    return '<div class="card" draggable="true" data-u="' + u + '" data-l="' + lt + '">' +
      '<div class="card-user">@' + u + '</div>' + nome +
      '<div class="card-meta">Lote ' + lt + '</div><div class="card-btns">' + acoes + '</div></div>';
  }).join('');
}

function atualizarSelecao(){
  const col2 = new Set(state.extraidos
    .filter(e => colunaDe(statusDe(e.username, e.lote)) === 2)
    .map(e => chave(e.username, e.lote)));
  [...state.selecionados].forEach(k => { if(!col2.has(k)) state.selecionados.delete(k); });
  const n = state.selecionados.size;
  document.getElementById('selInfo').textContent = n ? n + ' selecionado(s)' : '';
  document.getElementById('btnFluxo').disabled = n === 0;
}

// Marcacao de lote concluido: fica como evento com username "__lote__".
function estaConcluido(lote){
  const evs = state.eventos
    .filter(e => e.username === '__lote__' && e.lote === lote)
    .sort((a, b) => String(a.data_hora).localeCompare(String(b.data_hora)));
  return evs.length > 0 && evs[evs.length - 1].acao === 'lote_concluido';
}

async function alternarLote(marcar){
  const lote = document.getElementById('loteSel').value;
  const chk = document.getElementById('chkLoteOk');
  if(lote === 'todos') return;
  try{
    await registrar('__lote__', lote, marcar ? 'lote_concluido' : 'lote_aberto');
    atualizarLotes();
    render();
  }catch(err){
    chk.checked = !marcar;
    alert('Não consegui salvar: ' + err.message);
  }
}

// Só permite apagar um lote específico que ainda não foi enviado ao fluxo.
function atualizarBotaoLote(){
  const lote = document.getElementById('loteSel').value;
  const chk = document.getElementById('chkLoteOk');
  chk.disabled = lote === 'todos';
  chk.checked = lote !== 'todos' && estaConcluido(lote);
  const btn = document.getElementById('btnApagarLote');
  if(lote === 'todos'){ btn.disabled = true; btn.title = 'Escolha um lote específico'; return; }
  const enviado = state.extraidos.some(e => e.lote === lote && statusDe(e.username, e.lote) === 'enviado_fluxo');
  btn.disabled = enviado;
  btn.title = enviado ? 'Este lote tem contatos já enviados ao fluxo e não pode ser apagado' : 'Apagar este lote';
}

function abrirModalApagar(passo){
  const lote = document.getElementById('loteSel').value;
  const qtd = state.extraidos.filter(e => e.lote === lote).length;
  const box = document.getElementById('modalBox');
  if(passo === 1){
    box.innerHTML = '<h2>Apagar o lote ' + escapeHtml(lote) + '?</h2>' +
      '<p>Vão sair ' + qtd + ' contato(s) deste lote e todo o histórico deles no app.</p>' +
      '<div class="row"><button class="btn-ghost" id="mCancel">Cancelar</button><button class="btn-primary" id="mNext">Continuar</button></div>';
    document.getElementById('mNext').onclick = () => abrirModalApagar(2);
  } else {
    box.innerHTML = '<h2>Tem certeza?</h2>' +
      '<p>Essa ação não pode ser desfeita. Os perfis continuam na base de prospecção, então não voltam a ser extraídos.</p>' +
      '<div class="row"><button class="btn-ghost" id="mCancel">Cancelar</button><button class="btn-danger" id="mOk">Apagar lote</button></div>';
    document.getElementById('mOk').onclick = apagarLote;
  }
  document.getElementById('mCancel').onclick = fecharModal;
  document.getElementById('modal').classList.add('show');
}

async function apagarLote(){
  fecharModal();
  const lote = document.getElementById('loteSel').value;
  if(lote === 'todos') return;
  try{
    const r = await fetch(API + '/app-apagar-lote', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ lote: lote })
    });
    if(!r.ok) throw new Error('HTTP ' + r.status);
    state.extraidos = state.extraidos.filter(e => e.lote !== lote);
    state.eventos = state.eventos.filter(e => e.lote !== lote);
    state.historico = state.historico.filter(h => h.l !== lote);
    [...state.selecionados].forEach(k => { if(k.endsWith('|' + lote)) state.selecionados.delete(k); });
    atualizarLotes();
    render();
    alert('Lote ' + lote + ' apagado.');
  }catch(err){
    alert('Não consegui apagar o lote: ' + err.message);
  }
}

function atualizarLotes(){
  const sel = document.getElementById('loteSel');
  const atual = sel.value;
  const lotes = lotesOrdenados();
  sel.innerHTML = '<option value="todos">Todos os lotes</option>' +
    lotes.map(l => '<option value="' + escapeHtml(l.lote) + '">' + (estaConcluido(l.lote) ? '✅ ' : '') + escapeHtml(l.lote) + ' · ' + l.count + ' · ' + dataBr(l.data) + '</option>').join('');
  if(atual && (atual === 'todos' || lotes.some(l => l.lote === atual))) sel.value = atual;
  else if(lotes.length) sel.value = lotes[0].lote;
  atualizarBotaoLote();
}

/* ---------- comunicação com o n8n ---------- */
async function sincronizar(){
  document.getElementById('status').textContent = 'Carregando…';
  try{
    const r = await fetch(API + '/app-lotes');
    if(!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    state.extraidos = d.extraidos || [];
    state.eventos = d.eventos || [];
    atualizarLotes();
    document.getElementById('status').textContent =
      state.extraidos.length + ' extraídos · ' + state.eventos.length + ' ações · atualizado ' + new Date().toLocaleTimeString('pt-BR');
    render();
  }catch(err){
    document.getElementById('status').textContent = 'Erro ao carregar: ' + err.message;
  }
}

async function registrar(u, l, acao){
  const r = await fetch(API + '/app-acao', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ username: u, lote: l, acao: acao })
  });
  if(!r.ok) throw new Error('HTTP ' + r.status);
  state.eventos.push({ username: u, lote: l, acao: acao, data_hora: new Date().toISOString() });
}

// Registra a acao e guarda o estado anterior para poder desfazer.
async function aplicarAcao(u, l, acao){
  const anterior = statusDe(u, l) || 'desfeito';
  await registrar(u, l, acao);
  state.historico.push({ u: u, l: l, anterior: anterior });
  if(state.historico.length > 50) state.historico.shift();
}

async function desfazer(){
  const it = state.historico.pop();
  if(!it) return;
  try{
    await registrar(it.u, it.l, it.anterior);
    render();
  }catch(err){
    state.historico.push(it);
    alert('Não consegui desfazer: ' + err.message);
  }
}

async function acaoComErro(fn){
  try{ await fn(); render(); }
  catch(err){ alert('Não consegui salvar: ' + err.message); }
}

function marcarInsta(u, l){ return acaoComErro(() => aplicarAcao(u, l, 'insta_enviado')); }

function marcarRespondeu(u, l){
  state.selecionados.delete(chave(u, l));
  return acaoComErro(() => aplicarAcao(u, l, 'respondeu'));
}

/* ---------- arrastar entre colunas ---------- */
const ACAO_POR_COLUNA = {1: 'desfeito', 2: 'insta_enviado', 3: 'respondeu'};

function moverPorArrasto(u, l, coluna){
  const atual = colunaDe(statusDe(u, l));
  if(atual === coluna) return;
  if(coluna === 2) state.selecionados.delete(chave(u, l));
  // "desfeito" e um evento interno: a coluna 1 volta a ser o estado inicial.
  return acaoComErro(() => aplicarAcao(u, l, ACAO_POR_COLUNA[coluna]));
}

/* ---------- seleção ---------- */
function toggleSel(k){
  if(state.selecionados.has(k)) state.selecionados.delete(k); else state.selecionados.add(k);
  atualizarSelecao();
}

function selecionarTodos(){
  itensFiltrados().forEach(e => {
    if(colunaDe(statusDe(e.username, e.lote)) === 2) state.selecionados.add(chave(e.username, e.lote));
  });
  render();
}

function limparSelecao(){ state.selecionados.clear(); render(); }

/* ---------- confirmação em duas etapas ---------- */
function abrirModal(passo){
  const n = state.selecionados.size;
  const box = document.getElementById('modalBox');
  if(passo === 1){
    box.innerHTML = '<h2>Enviar ' + n + ' contato(s) para o fluxo?</h2>' +
      '<p>Os contatos marcados vão para o n8n e entram na fila de envio.</p>' +
      '<div class="row"><button class="btn-ghost" id="mCancel">Cancelar</button><button class="btn-primary" id="mNext">Continuar</button></div>';
    document.getElementById('mNext').onclick = () => abrirModal(2);
  } else {
    box.innerHTML = '<h2>Confirmar envio?</h2>' +
      '<p>Isso vai disparar as mensagens de e-mail e WhatsApp nas próximas janelas (09h, 13h e 17h). Quem respondeu fica de fora.</p>' +
      '<div class="row"><button class="btn-ghost" id="mCancel">Cancelar</button><button class="btn-ok" id="mOk">Confirmar</button></div>';
    document.getElementById('mOk').onclick = enviarFluxo;
  }
  document.getElementById('mCancel').onclick = fecharModal;
  document.getElementById('modal').classList.add('show');
}

function fecharModal(){ document.getElementById('modal').classList.remove('show'); }

async function enviarFluxo(){
  fecharModal();
  const pares = [...state.selecionados].map(k => {
    const i = k.indexOf('|');
    return { username: k.slice(0, i), lote: k.slice(i + 1) };
  });
  if(!pares.length) return;
  try{
    const r = await fetch(FLUXO, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ profiles: pares.map(p => ({ username: p.username })) })
    });
    if(!r.ok) throw new Error('fluxo HTTP ' + r.status);
    for(const p of pares){ await aplicarAcao(p.username, p.lote, 'enviado_fluxo'); }
    state.selecionados.clear();
    render();
    alert(pares.length + ' contato(s) enviados ao fluxo.');
  }catch(err){
    alert('Erro ao enviar: ' + err.message);
  }
}

/* ---------- abrir perfil ---------- */
function abrirIG(u){
  window.location.href = 'instagram://user?username=' + encodeURIComponent(u);
  setTimeout(() => window.open('https://www.instagram.com/' + encodeURIComponent(u) + '/', '_blank'), 700);
}

/* ---------- eventos ---------- */
document.getElementById('loteSel').addEventListener('change', render);
document.getElementById('busca').addEventListener('input', render);
document.getElementById('btnSync').addEventListener('click', sincronizar);
document.getElementById('btnApagarLote').addEventListener('click', () => abrirModalApagar(1));
document.getElementById('chkLoteOk').addEventListener('change', e => alternarLote(e.target.checked));
document.getElementById('btnSelTodos').addEventListener('click', selecionarTodos);
document.getElementById('btnLimpar').addEventListener('click', limparSelecao);
document.getElementById('btnDesfazer').addEventListener('click', desfazer);
document.getElementById('btnFluxo').addEventListener('click', () => abrirModal(1));
document.getElementById('modal').addEventListener('click', e => { if(e.target.id === 'modal') fecharModal(); });

const board = document.querySelector('.board');

board.addEventListener('click', e => {
  const b = e.target.closest('button');
  if(!b) return;
  if(b.dataset.abrir) return abrirIG(b.dataset.abrir);
  if(b.dataset.insta) return marcarInsta(b.dataset.insta, b.dataset.lote);
  if(b.dataset.resp) return marcarRespondeu(b.dataset.resp, b.dataset.lote);
});

board.addEventListener('change', e => {
  if(e.target.dataset.sel) toggleSel(e.target.dataset.sel);
});

board.addEventListener('dragstart', e => {
  const card = e.target.closest('.card');
  if(!card) return;
  e.dataTransfer.setData('text/plain', card.dataset.u + '|' + card.dataset.l);
  e.dataTransfer.effectAllowed = 'move';
  card.classList.add('dragging');
});

board.addEventListener('dragend', e => {
  const card = e.target.closest('.card');
  if(card) card.classList.remove('dragging');
  document.querySelectorAll('.col.over').forEach(c => c.classList.remove('over'));
});

board.addEventListener('dragover', e => {
  const col = e.target.closest('.col');
  if(!col) return;
  e.preventDefault();
  col.classList.add('over');
});

board.addEventListener('dragleave', e => {
  const col = e.target.closest('.col');
  if(col && !col.contains(e.relatedTarget)) col.classList.remove('over');
});

board.addEventListener('drop', e => {
  const col = e.target.closest('.col');
  if(!col) return;
  e.preventDefault();
  col.classList.remove('over');
  const dados = e.dataTransfer.getData('text/plain');
  const i = dados.indexOf('|');
  if(i < 0) return;
  moverPorArrasto(dados.slice(0, i), dados.slice(i + 1), Number(col.dataset.col));
});

sincronizar();
</script>
